<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>memento</title>
  <style>
    /* system fonts — no remote loading */

    :root {
      --bg:      #08080c;
      --bg1:     #0e0e14;
      --surface: #1c1c2a;
      --border:  #252535;
      --text:    #d0d0dc;
      --dim:     #5a5a6e;
      --accent:  #8b7cf6;
      --green:   #34d399;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── HOME STATE ── */
    .home {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 85vh;
      gap: 24px;
      padding: 40px 20px;
    }

    .home.has-results {
      min-height: auto;
      padding: 30px 20px 16px;
      justify-content: flex-start;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-ghost {
      width: 42px;
      height: 42px;
      border-radius: 10px;
    }

    .home.has-results .logo-ghost { width: 28px; height: 28px; border-radius: 7px; }

    .logo-text {
      font-size: 42px;
      font-weight: 300;
      letter-spacing: 8px;
      color: var(--text);
    }

    .home.has-results .logo-text { font-size: 24px; letter-spacing: 4px; }

    .search-box {
      width: 100%;
      max-width: 620px;
      display: flex;
      background: var(--bg1);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 0 20px;
      height: 48px;
      align-items: center;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .home.has-results .search-box { height: 40px; border-radius: 20px; }

    .search-box:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(139, 124, 246, 0.1);
    }

    .search-icon { color: var(--dim); font-size: 16px; margin-right: 12px; }

    .search-input {
      flex: 1;
      background: none;
      border: none;
      color: var(--text);
      font-family: inherit;
      font-size: 15px;
      outline: none;
      caret-color: var(--accent);
    }

    .home.has-results .search-input { font-size: 13px; }
    .search-input::placeholder { color: var(--dim); }

    .search-btn {
      background: none;
      border: none;
      color: var(--accent);
      cursor: pointer;
      font-size: 14px;
      padding: 4px 8px;
      border-radius: 6px;
      transition: background 0.1s;
    }

    .search-btn:hover { background: var(--surface); }

    .tagline {
      font-size: 12px;
      color: var(--dim);
      letter-spacing: 2px;
    }

    .home.has-results .tagline { display: none; }

    .features {
      display: flex;
      gap: 32px;
      margin-top: 8px;
    }

    .home.has-results .features { display: none; }

    .feature {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--dim);
    }

    .feature-dot { color: var(--green); font-size: 8px; }

    /* ── RESULTS ── */
    .results {
      max-width: 700px;
      margin: 0 auto;
      padding: 0 20px 40px;
    }

    .results-meta {
      font-size: 11px;
      color: var(--dim);
      margin-bottom: 16px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }

    .src-tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }

    .src-tab {
      background: var(--bg1);
      border: 1px solid var(--border);
      color: var(--dim);
      border-radius: 6px;
      padding: 5px 12px;
      font-size: 11px;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.15s;
    }

    .src-tab:hover { border-color: var(--accent); color: var(--text); }
    .src-tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }

    .src-badge {
      display: inline-block;
      font-size: 9px;
      padding: 1px 6px;
      border-radius: 3px;
      margin-right: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .src-web { background: #1e3a5f; color: #7cc4ff; }
    .src-onion { background: #3a1e5f; color: #c47cff; }
    .src-torrent { background: #5f3a1e; color: #ffb47c; }

    .result {
      margin-bottom: 20px;
      padding: 12px 16px;
      border-radius: 10px;
      transition: background 0.1s;
    }

    .result:hover { background: var(--bg1); }

    .result-url {
      font-size: 11px;
      color: var(--dim);
      margin-bottom: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .result-title {
      font-size: 16px;
      font-weight: 500;
      color: var(--accent);
      text-decoration: none;
      display: block;
      margin-bottom: 4px;
      line-height: 1.4;
    }

    .result-title:hover { text-decoration: underline; }

    .result-snippet {
      font-size: 13px;
      color: var(--dim);
      line-height: 1.5;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: var(--dim);
      font-size: 13px;
    }

    .loading-dot {
      display: inline-block;
      animation: blink 1s step-end infinite;
    }

    @keyframes blink { 50% { opacity: 0; } }

    .error {
      text-align: center;
      padding: 40px;
      color: var(--dim);
      font-size: 13px;
    }

    .no-results {
      text-align: center;
      padding: 60px 20px;
      color: var(--dim);
    }

    .no-results-icon { font-size: 32px; margin-bottom: 12px; opacity: 0.5; }
    .no-results-text { font-size: 13px; }

    .footer {
      text-align: center;
      padding: 20px;
      font-size: 10px;
      color: var(--dim);
      opacity: 0.4;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div class="home" id="home">
    <div class="logo">
      <img class="logo-ghost" src="icon.png" alt="ghoster">
      <span class="logo-text">memento</span>
    </div>

    <div class="search-box">
      <span class="search-icon">⌕</span>
      <input type="text" class="search-input" id="search" placeholder="memoria oblivio" autofocus spellcheck="false" autocomplete="off">
      <button class="search-btn" id="search-btn">→</button>
    </div>

    <div class="tagline">trust no one.</div>

    <div class="features">
      <div class="feature"><span class="feature-dot">●</span> no logs</div>
      <div class="feature"><span class="feature-dot">●</span> no cookies</div>
      <div class="feature"><span class="feature-dot">●</span> no tracking</div>
      <div class="feature"><span class="feature-dot">●</span> tor routed</div>
    </div>
  </div>

  <div id="results-container"></div>

  <div class="footer" id="footer">memento — nothing stored, nothing remembered</div>

  <script>
    const searchInput = document.getElementById("search");
    const searchBtn = document.getElementById("search-btn");
    const home = document.getElementById("home");
    const resultsContainer = document.getElementById("results-container");

    let allResults = { web: [], onion: [], torrent: [] };
    let currentFilter = "all";
    let currentQuery = "";

    async function doSearch(query) {
      if (!query.trim()) return;
      currentQuery = query;

      home.classList.add("has-results");
      resultsContainer.innerHTML = '<div class="loading">searching web + tor + torrents<span class="loading-dot">_</span></div>';
      allResults = { web: [], onion: [], torrent: [] };

      // Fire all three sources in parallel
      const [web, onion, torrent] = await Promise.allSettled([
        searchDDG(query),
        searchAhmia(query),
        searchBTDigg(query),
      ]);

      allResults.web = web.status === "fulfilled" ? web.value : [];
      allResults.onion = onion.status === "fulfilled" ? onion.value : [];
      allResults.torrent = torrent.status === "fulfilled" ? torrent.value : [];

      renderAll();
    }

    // ── DuckDuckGo (clearnet web) ──
    async function searchDDG(query) {
      const resp = await fetch("https://html.duckduckgo.com/html/?q=" + encodeURIComponent(query));
      const html = await resp.text();
      const results = [];
      const re = /<a[^>]+class="result__a"[^>]+href="([^"]+)"[^>]*>([\s\S]*?)<\/a>/gi;
      let m;
      while ((m = re.exec(html)) !== null) {
        let url = m[1];
        const title = m[2].replace(/<[^>]+>/g, "").trim();
        if (url.includes("uddg=")) {
          const uddg = url.match(/uddg=([^&]+)/);
          if (uddg) url = decodeURIComponent(uddg[1]);
        }
        if (url.startsWith("http") && title && !results.find(r => r.url === url)) {
          results.push({ url, title, source: "web" });
        }
      }
      const snipRe = /<a[^>]+class="result__snippet"[^>]*>([\s\S]*?)<\/a>/gi;
      let si = 0;
      while ((m = snipRe.exec(html)) !== null && si < results.length) {
        results[si].snippet = m[1].replace(/<[^>]+>/g, "").trim().slice(0, 200);
        si++;
      }
      return results.slice(0, 20);
    }

    // ── Ahmia (.onion hidden services) ──
    async function searchAhmia(query) {
      const resp = await fetch("https://ahmia.fi/search/?q=" + encodeURIComponent(query));
      const html = await resp.text();
      const results = [];
      // Ahmia results: <li class="result"><h4><a href="/search/redirect?...redirect_url=URL">title</a>
      const re = /<a[^>]+href="([^"]*(?:redirect_url=|http[^"]*\.onion)[^"]*)"[^>]*>([\s\S]*?)<\/a>/gi;
      let m;
      while ((m = re.exec(html)) !== null) {
        let url = m[1];
        const rd = url.match(/redirect_url=([^&"]+)/);
        if (rd) url = decodeURIComponent(rd[1]);
        const title = m[2].replace(/<[^>]+>/g, "").trim();
        if (url.includes(".onion") && title && !results.find(r => r.url === url)) {
          results.push({ url, title, source: "onion" });
        }
      }
      // snippets
      const snipRe = /<p>([\s\S]*?)<\/p>/gi;
      let si = 0;
      while ((m = snipRe.exec(html)) !== null && si < results.length) {
        const txt = m[1].replace(/<[^>]+>/g, "").trim();
        if (txt.length > 20) { results[si].snippet = txt.slice(0, 200); si++; }
      }
      return results.slice(0, 20);
    }

    // ── BTDigg (torrent / DHT) ──
    async function searchBTDigg(query) {
      const resp = await fetch("https://btdig.com/search?q=" + encodeURIComponent(query));
      const html = await resp.text();
      const results = [];
      // BTDigg: <div class="one_result"> ... <a href="magnet:?...">name</a> ... size ... files
      const blockRe = /<div class="one_result"[\s\S]*?<\/div>\s*<\/div>/gi;
      let block;
      while ((block = blockRe.exec(html)) !== null) {
        const b = block[0];
        const nameM = b.match(/<div class="torrent_name"[^>]*>[\s\S]*?<a[^>]*>([\s\S]*?)<\/a>/i);
        const magM = b.match(/href="(magnet:\?[^"]+)"/i);
        const sizeM = b.match(/<span class="torrent_size"[^>]*>([\s\S]*?)<\/span>/i);
        const filesM = b.match(/<span class="torrent_files"[^>]*>([\s\S]*?)<\/span>/i);
        if (nameM && magM) {
          const title = nameM[1].replace(/<[^>]+>/g, "").trim();
          const magnet = magM[1];
          let snippet = "";
          if (sizeM) snippet += "size: " + sizeM[1].replace(/<[^>]+>/g, "").trim() + " ";
          if (filesM) snippet += "· files: " + filesM[1].replace(/<[^>]+>/g, "").trim();
          results.push({ url: magnet, title, snippet, source: "torrent" });
        }
      }
      return results.slice(0, 20);
    }

    function renderAll() {
      const web = allResults.web, onion = allResults.onion, torrent = allResults.torrent;
      const total = web.length + onion.length + torrent.length;

      if (total === 0) {
        resultsContainer.innerHTML =
          '<div class="no-results"><div class="no-results-icon"><img src="icon.png" style="width:48px;height:48px;border-radius:10px;opacity:0.5"></div><div class="no-results-text">nothing found — even ghosts have limits</div></div>';
        return;
      }

      let html = '<div class="results">';
      // Filter tabs
      html += '<div class="src-tabs">';
      html += tabBtn("all", "all (" + total + ")");
      html += tabBtn("web", "◈ web (" + web.length + ")");
      html += tabBtn("onion", "▣ onion (" + onion.length + ")");
      html += tabBtn("torrent", "▾ torrents (" + torrent.length + ")");
      html += '</div>';

      let list = [];
      if (currentFilter === "all") list = [...web, ...onion, ...torrent];
      else if (currentFilter === "web") list = web;
      else if (currentFilter === "onion") list = onion;
      else if (currentFilter === "torrent") list = torrent;

      for (const r of list) {
        html += renderResult(r);
      }
      html += '</div>';
      resultsContainer.innerHTML = html;

      document.querySelectorAll(".src-tab").forEach(t => {
        t.addEventListener("click", () => { currentFilter = t.dataset.src; renderAll(); });
      });
    }

    function tabBtn(src, label) {
      return '<button class="src-tab' + (currentFilter === src ? ' active' : '') + '" data-src="' + src + '">' + label + '</button>';
    }

    function renderResult(r) {
      let label = "", cls = "";
      if (r.source === "onion") { label = "onion"; cls = "src-onion"; }
      else if (r.source === "torrent") { label = "torrent"; cls = "src-torrent"; }
      else { label = "web"; cls = "src-web"; }

      let display = r.url;
      if (r.source === "torrent") {
        const dn = r.url.match(/dn=([^&]+)/);
        display = "magnet: " + (dn ? decodeURIComponent(dn[1]).slice(0, 40) : "torrent");
      } else {
        try { display = new URL(r.url).hostname; } catch {}
      }

      let h = '<div class="result">';
      h += '<div class="result-url"><span class="src-badge ' + cls + '">' + label + '</span> ' + escapeHtml(display) + '</div>';
      h += '<a class="result-title" href="' + escapeHtml(r.url) + '">' + escapeHtml(r.title) + '</a>';
      if (r.snippet) h += '<div class="result-snippet">' + escapeHtml(r.snippet) + '</div>';
      h += '</div>';
      return h;
    }

    function escapeHtml(s) {
      return (s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    searchInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") { currentFilter = "all"; doSearch(searchInput.value); }
    });

    searchBtn.addEventListener("click", () => { currentFilter = "all"; doSearch(searchInput.value); });

    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.has("q")) {
      const q = urlParams.get("q");
      searchInput.value = q;
      doSearch(q);
    }
  </script>
</body>
</html>
